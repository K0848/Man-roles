<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1320" viewBox="0 0 1460 1320" role="img" aria-labelledby="title description">
  <title id="title">向古人问惑 · 系统架构</title>
  <desc id="description">产品装配入口组合浏览器交互、产品 Host 服务与 DSH 底座。浏览器通过产品 Remote API 读取投影并提交操作。产品 Host 负责人物编排、证据检索与回答校验、状态分析和标题生成；DSH 提供 Agent、Session、存储和模型适配。人物资料、产品领域记录与人物私有 Session 分别维护。外部模型服务通过模型适配器接入。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="model-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#936547"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #203047; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #5c6c80; }
      .layer { font-size: 23px; font-weight: 700; }
      .package { font-size: 18px; fill: #52657d; }
      .heading { font-size: 22px; font-weight: 600; }
      .body { font-size: 18px; fill: #475b73; }
      .small { font-size: 17px; fill: #5c6c80; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .two-way { fill: none; stroke: #64748b; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .product-card { fill: #ffffff; stroke: #bdd1e8; stroke-width: 1.5; }
      .foundation-card { fill: #ffffff; stroke: #b9d5ca; stroke-width: 1.5; }
      .data-card { fill: #ffffff; stroke: #d0c8e2; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1460" height="1320" fill="#ffffff"/>
  <text x="40" y="53" class="title">向古人问惑 · 系统架构</text>
  <text x="40" y="86" class="subtitle">产品模块、运行底座与数据边界</text>

  <rect x="40" y="110" width="1050" height="90" rx="14" fill="#fff8ed" stroke="#e5d1ae" stroke-width="1.5"/>
  <text x="64" y="145" class="layer">产品装配入口</text>
  <text x="278" y="145" class="package">man-roleplayer-app</text>
  <text x="64" y="177" class="body">组合 base、web-app 与产品模块；绑定人物资料、角色设定、模型与执行预算</text>
  <path d="M 565 200 V 226" class="arrow" stroke-dasharray="5 5"/>

  <rect x="40" y="226" width="1050" height="1054" rx="16" fill="#f8fafc" stroke="#aab8c8" stroke-width="1.5"/>
  <text x="64" y="255" class="small">本机运行环境：浏览器 + Node.js Host</text>

  <rect x="64" y="274" width="1002" height="158" rx="12" fill="#edf5ff" stroke="#9ebfe4" stroke-width="1.5"/>
  <text x="88" y="307" class="layer">浏览器表现层</text>
  <text x="290" y="307" class="package">ui-man-roleplayer · React</text>
  <rect x="88" y="324" width="294" height="44" rx="8" class="product-card"/>
  <rect x="418" y="324" width="294" height="44" rx="8" class="product-card"/>
  <rect x="748" y="324" width="294" height="44" rx="8" class="product-card"/>
  <text x="235" y="352" text-anchor="middle" class="body">困惑导航 · 人物卡册</text>
  <text x="565" y="352" text-anchor="middle" class="body">人物对话 · 回答活动</text>
  <text x="895" y="352" text-anchor="middle" class="body">共享状态 · 视角 · 资料</text>
  <rect x="88" y="384" width="954" height="30" rx="6" fill="#dceafa"/>
  <text x="565" y="405" text-anchor="middle" class="small">RoleplayerProjectionStore · 统一客户端投影</text>

  <path d="M 565 432 V 460" class="two-way"/>
  <rect x="260" y="460" width="610" height="52" rx="10" fill="#ffffff" stroke="#9ebfe4" stroke-width="1.5"/>
  <text x="565" y="492" text-anchor="middle" class="heading">产品 Remote API · 操作命令 / 脱敏投影</text>
  <path d="M 565 512 V 540" class="two-way"/>

  <rect x="64" y="540" width="1002" height="258" rx="12" fill="#edf5ff" stroke="#9ebfe4" stroke-width="1.5"/>
  <text x="88" y="575" class="layer">产品服务层</text>
  <text x="269" y="575" class="package">man-roleplayer · Host 权威规则</text>
  <rect x="88" y="602" width="294" height="114" rx="9" class="product-card"/>
  <rect x="418" y="602" width="294" height="114" rx="9" class="product-card"/>
  <rect x="748" y="602" width="294" height="114" rx="9" class="product-card"/>
  <text x="235" y="634" text-anchor="middle" class="heading">困惑与人物编排</text>
  <text x="235" y="665" text-anchor="middle" class="body">分支分配 · 上下文隔离</text>
  <text x="235" y="693" text-anchor="middle" class="body">轮次预算 · 停止与恢复</text>
  <text x="565" y="634" text-anchor="middle" class="heading">检索与回答校验</text>
  <text x="565" y="665" text-anchor="middle" class="body">本地资料检索 · 证据引用</text>
  <text x="565" y="693" text-anchor="middle" class="body">史实归属 · 资料生命周期</text>
  <text x="895" y="634" text-anchor="middle" class="heading">状态分析与自动标题</text>
  <text x="895" y="665" text-anchor="middle" class="body">独立模型辅助任务</text>
  <text x="895" y="693" text-anchor="middle" class="body">Host 校验 · 用户确认状态</text>
  <rect x="88" y="736" width="954" height="40" rx="7" fill="#dceafa"/>
  <text x="565" y="762" text-anchor="middle" class="body">产品领域事实：共享状态 · 时间线引用 · 归档与删除操作</text>

  <path d="M 565 798 V 846" class="arrow"/>
  <text x="583" y="830" class="small">调用底座能力</text>
  <rect x="64" y="846" width="1002" height="176" rx="12" fill="#eff8f3" stroke="#98c4b1" stroke-width="1.5"/>
  <text x="88" y="880" class="layer">DSH 运行底座</text>
  <text x="300" y="880" class="package">复用 · Cordis 插件与生命周期</text>
  <rect x="88" y="908" width="294" height="88" rx="9" class="foundation-card"/>
  <rect x="418" y="908" width="294" height="88" rx="9" class="foundation-card"/>
  <rect x="748" y="908" width="294" height="88" rx="9" class="foundation-card"/>
  <text x="235" y="941" text-anchor="middle" class="heading">Agent / Session</text>
  <text x="235" y="974" text-anchor="middle" class="body">按人物隔离的执行与历史</text>
  <text x="565" y="941" text-anchor="middle" class="heading">Storage / Persistence</text>
  <text x="565" y="974" text-anchor="middle" class="body">领域记录与会话持久化</text>
  <text x="895" y="941" text-anchor="middle" class="heading">LLM Adapter</text>
  <text x="895" y="974" text-anchor="middle" class="body">模型请求与响应适配</text>

  <path d="M 1042 952 H 1140" fill="none" stroke="#936547" stroke-width="2" marker-start="url(#model-arrow)" marker-end="url(#model-arrow)"/>
  <text x="1091" y="934" text-anchor="middle" class="small">HTTPS</text>
  <rect x="1140" y="908" width="280" height="132" rx="12" fill="#fff8ed" stroke="#d7ba94" stroke-width="1.5"/>
  <text x="1280" y="944" text-anchor="middle" class="heading">外部模型 API</text>
  <text x="1280" y="978" text-anchor="middle" class="body">所配置的模型服务</text>
  <text x="1280" y="1009" text-anchor="middle" class="small">接收上下文 · 返回生成内容</text>

  <path d="M 565 1022 V 1070" class="two-way"/>
  <text x="583" y="1054" class="small">读取资源 / 持久化</text>
  <rect x="64" y="1070" width="1002" height="178" rx="12" fill="#f5f2fa" stroke="#c3b5d9" stroke-width="1.5"/>
  <text x="88" y="1104" class="layer">内容与持久化</text>
  <text x="300" y="1104" class="package">资源随源码交付 · 运行数据保存在本机</text>
  <rect x="88" y="1130" width="294" height="94" rx="9" class="data-card"/>
  <rect x="418" y="1130" width="294" height="94" rx="9" class="data-card"/>
  <rect x="748" y="1130" width="294" height="94" rx="9" class="data-card"/>
  <text x="235" y="1161" text-anchor="middle" class="heading">人物内容资源</text>
  <text x="235" y="1192" text-anchor="middle" class="body">五份 research 文档 + preset</text>
  <text x="565" y="1158" text-anchor="middle" class="heading">产品领域记录</text>
  <text x="565" y="1187" text-anchor="middle" class="body">产品事件 · 共享状态</text>
  <text x="565" y="1210" text-anchor="middle" class="small">操作与恢复事实</text>
  <text x="895" y="1161" text-anchor="middle" class="heading">人物私有会话</text>
  <text x="895" y="1192" text-anchor="middle" class="body">Session JSONL · 回答正文</text>

  <text x="40" y="1307" class="small">虚线：装配关系　实线：模块间交互与依赖　框内展示逻辑职责，产品服务与 DSH 底座运行于同一个 Host 进程</text>
</svg>
